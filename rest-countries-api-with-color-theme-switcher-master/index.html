<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="styles/style.css" />

    <link rel="stylesheet" href="./styles/details.css">

    <title>Rest Countries API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <h1>Where in the world?</h1>
      <button class="btn-theme-mode">
        <i class="fa-solid fa-moon"></i>
        <span class="txt-theme-mode">Dark Mode</span>
      </button>
    </header>

    <main>
      <div class="container-filter-datas">
        <div class="search">
          <i class="fa-solid fa-search"></i>
          <input
            type="text"
            class="input-search-country"
            placeholder="Search for a country..."
          />
        </div>

        <select name="filter-region" id="filter-region" class="filter-region">
          <option value="">Filter by Region</option>
          <option value="Africa">Africa</option>
          <option value="America">America</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>
      </div>
      <div id="lista-paises" class="container-cards"></div>

       <section id="home-view">
        <div class="container-filter-datas">.</div>
        <div id="lista-paises" class="container-cards"></div>
      </section>

      <section id="details-view" class="hidden"></section>
    </main>
    <script type="module" src="scripts/script.js"></script>
  </body>
</html>
