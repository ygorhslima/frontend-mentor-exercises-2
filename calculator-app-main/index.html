<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">  
  
  <title>Frontend Mentor | Calculator app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/root-themes.css">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main id="conteudo-principal">
    <div class="calculadora">
      <div class="div-title">
        <p>calc</p>
        <div class="themes">
          <p>theme</p>
          <div class="theme-switcher">
              <div class="toggle-container"> 
                  <label for="theme1" class="theme-label">1</label>
                  <label for="theme2" class="theme-label">2</label>
                  <label for="theme3" class="theme-label">3</label>

                  <input type="radio" id="theme1" name="theme-choice" value="1" checked>
                  <input type="radio" id="theme2" name="theme-choice" value="2">
                  <input type="radio" id="theme3" name="theme-choice" value="3">
                  
                  <div class="slider-ball"></div> 
              </div>
          </div>
        </div>
      </div>

      <div class="display">
        <div id="resultado"></div>
      </div>

      <div class="calc">
        <div class="row-calc">
          <button class="btn">7</button>
          <button class="btn">8</button>
          <button class="btn">9</button>
          <button class="btn btn-del-reset">del</button> </div>
        <div class="row-calc">
          <button class="btn">4</button>
          <button class="btn">5</button>
          <button class="btn">6</button>
          <button class="btn">+</button>
        </div>
        <div class="row-calc">
          <button class="btn">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn">-</button>
        </div>
        <div class="row-calc">
          <button class="btn">.</button>
          <button class="btn">0</button>
          <button class="btn">/</button>
          <button class="btn">*</button>
        </div>
        <div class="row-footer">
          <button class="btn btn-del-reset btn-large">reset</button>
          <button class="btn btn-equals btn-large">=</button>
        </div>
      </div>
    </div>
    
  </main>
  <script src="scripts/theme-switcher.js"></script>
  <script src="scripts/calc-logic.js"></script>
</body>
</html>
