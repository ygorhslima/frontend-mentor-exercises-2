<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Weather app</title>
  </head>
  <body>
    <header>
      <img src="assets/images/logo.svg" alt="Weather Now" />

      <select name="units" id="units" class="select-units">
        <option value="units">Units</option>

        <optgroup label="Temperature">
          <option value="Celsius">Celsius (°C)</option>
          <option value="Fahrenheit">Fahrenheit (°F)</option>
        </optgroup>

        <optgroup label="Wind Speed">
          <option value="Kmh">Km/h</option>
          <option value="mph">mph</option>
        </optgroup>

        <optgroup label="Precipitation">
          <option value="Millimeters">Millimeters</option>
          <option value="Inches">Inches (in)</option>
        </optgroup>
      </select>
    </header>

    <main>
      <section class="search-section">
        <h1 class="search-title">How's the sky looking today?</h1>

        <div class="search-container">
          <span>
            <img src="assets/images/icon-search.svg" alt="" />
            <input
              type="text"
              id="search-place"
              placeholder="Search for a place..."
            />
          </span>

          <button class="search-button">Search</button>
        </div>
      </section>

      <section class="weather-section">
        <div class="weather-card-info">
          <div class="info">
            <h3>Berlin, Germany</h3>
            <p>Tuesday, Aug 5, 2025</p>
          </div>
          <div class="weather">
            <img src="assets/images/icon-sunny.webp" alt="icon-sunny" />
            <p class="temperature">20°</p>
          </div>
        </div>

        <div class="weather-card-info-details">
          <div class="card">
            <p class="card-info">Feels Like</p>
            <span class="card-temperature">18°</span>
          </div>

          <div class="card">
            <p class="card-info">Humidity</p>
            <span class="card-humidity">46%</span>
          </div>

          <div class="card">
            <p class="card-info">Wind</p>
            <span class="card-wind">14 km/h</span>
          </div>

          <div class="card">
            <p class="card-info">Precipitation</p>
            <span class="card-precipitation">0 mm</span>
          </div>
        </div>

        <div class="weather-daily-forecast">
          <div>
            <p>Tue</p>
            <img src="assets/images/icon-rain.webp" alt="" />
          </div>
          <div>
            <p>Wed</p>
            <img src="assets/images/icon-drizzle.webp" alt="" />
          </div>
          <div>
            <p>Thu</p>
            <img src="assets/images/icon-sunny.webp" alt="" />
          </div>
          <div>
            <p>Fri</p>
            <img src="assets/images/icon-partly-cloudy.webp" alt="" />
          </div>
          <div>
            <p>Sat</p>
            <img src="assets/images/icon-storm.webp" alt="" />
          </div>
          <div>
            <p>Sun</p>
            <img src="assets/images/icon-snow.webp" alt="" />
          </div>
          <div>
            <p>Mon</p>
            <img src="assets/images/icon-fog.webp" alt="" />
          </div>
        </div>

        <div class="weather-hourly-forecast">
          <div>
            <h4>Hourly forecast</h4>
            <select name="" id=""></select>
          </div>

          <div>
            <img src="assets/images/icon-" alt="" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
